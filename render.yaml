services:
  - type: web
    name: flood-prediction-early-warning
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flood-prediction-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: flood-prediction-db
    plan: starter
    databaseName: flood_data
    user: flood_user
